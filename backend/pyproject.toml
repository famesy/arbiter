[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "arbiter"
version = "0.1.0"
description = "Share Zephyr dev boards between AI coding agents (Claude Code, Codex) and a human"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "starlette>=1.10.0",
  "uvicorn>=0.54.0",
  "websockets>=17.3",
  "httpx>=0.28.1",
  "mcp>=2.3.0",
  "pyserial>=3.5",
  "psutil>=7.2.2",
  "tomlkit>=0.15.2",  # edits config.toml from the Settings page with comments kept
]

[project.optional-dependencies]
rtt = ["pylink-square>=2.0.2"]
ppk2 = ["ppk2-api>=0.9.2"]
tui = ["textual>=8.2.8"]  # `arbiter tui`, the terminal UI
test = ["pytest>=9.2.0", "pytest-asyncio>=1.4.1"]

[project.scripts]
arbiter = "arbiter.cli:main"
arbiterd = "arbiter.daemon:run_daemon"
arbiter-mcp = "arbiter.mcp_server:main"

# Third-party drivers and power devices register themselves here, e.g.
# [project.entry-points."arbiter.drivers"]  mykit = "mypkg.driver:MyKitDriver"
# [project.entry-points."arbiter.power"]    mypsu = "mypkg.power:MyPsu"

[tool.hatch.build.targets.wheel]
packages = ["arbiter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: needs native_sim (Linux), real hardware or network; skipped unless -m integration",
]
addopts = "-m 'not integration'"
