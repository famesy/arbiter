# Type checking for the whole repo. Run from the repo root: `mypy`
[mypy]
python_version = 3.11
files = backend
exclude = (^|/)(build|\.venv|venv)/
strict = True
warn_unreachable = True
pretty = True
# Hardware libraries ship without type hints.
[mypy-ppk2_api.*,pyocd.*,pylink.*,serial.*,usb.*,pystray.*]
ignore_missing_imports = True

[mypy-backend.tests.*,tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
